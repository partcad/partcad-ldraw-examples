# PartCAD package: worked examples built from the LDraw parts library.
#
# The parts come from '//pub/universe/lego/ldraw', which serves the LDraw
# library (https://library.ldraw.org) as parametric PartCAD parts. Nothing is
# vendored here: this package is the assemblies, and the geometry is meshed
# from LDraw's own .dat files on demand.
name: //pub/examples/lego

desc: Assemblies built from the LDraw LEGO parts library.
url: https://library.ldraw.org/
poc: kuzmenkor@gmail.com
partcad: ">=0.8.115"

# Nothing here is a catalogue item somebody can order: these are models built
# out of parts that already exist.
manufacturable: false

dependencies:
  pub:
    # Loaded as '//pub' when this package is the root, and not at all when the
    # index itself imports this package: without it the index would be
    # imported a second time inside itself, as '//pub/examples/lego/pub', and
    # a recursive walk from here ('pc test -r', 'pc render -r') would go
    # through the whole of it instead of through this package. What it loads
    # is the one branch of the index these models use; see its partcad.yaml.
    onlyInRoot: true
    type: local
    path: deps/pub

assemblies:
  castle/spire:
    type: assy
    map:
      spire_s0-anti-c0r0: [spire_s0, //pub/universe/lego:anti-stud, c0r0]
    desc: "A tower's needle roof - two 2x2 cones flaring off the tower, then two 1x1 cones drawing it to a point"
  castle/buttress:
    type: assy
    map:
      butt_c0-anti-c0r0: [butt_c0, //pub/universe/lego:anti-stud, c0r0]
    desc: "A pier stepping out from the wall, capped with a pinnacle"
  castle/tower-corner:
    type: assy
    map:
      t_c0-anti-c0r0: [t_c0, //pub/universe/lego:anti-stud, c0r0]
      t_c14-stud-c0r0: [t_c14, //pub/universe/lego:stud, c0r0]
    desc: "The body of a corner tower, 15 courses of 2x2 round brick"
  castle/tower-mural:
    type: assy
    map:
      t_c0-anti-c0r0: [t_c0, //pub/universe/lego:anti-stud, c0r0]
      t_c11-stud-c0r0: [t_c11, //pub/universe/lego:stud, c0r0]
    desc: "The body of a tower standing along the wall, 12 courses"
  castle/tower-gate:
    type: assy
    map:
      t_c0-anti-c0r0: [t_c0, //pub/universe/lego:anti-stud, c0r0]
      t_c12-stud-c0r0: [t_c12, //pub/universe/lego:stud, c0r0]
    desc: "The body of one of the gatehouse pair, 13 courses"
  castle/wall:
    type: assy
    map:
      w_c0_0-anti-c0r0: [w_c0_0, //pub/universe/lego:anti-stud, c0r0]
    desc: "A stretch of curtain wall between two corner towers, with its lancets and crenellations"
  castle/wall-gate:
    type: assy
    map:
      wL_c0_0-anti-c0r0: [wL_c0_0, //pub/universe/lego:anti-stud, c0r0]
    desc: "The same wall with the gateway's pointed arch corbelled through it"
  castle/keep-courses:
    type: assy
    map:
      kE_c0_0-anti-c0r0: [kE_c0_0, //pub/universe/lego:anti-stud, c0r0]
      kE_c1_1-stud-c1r0: [kE_c1_1, //pub/universe/lego:stud, c1r0]
      kE_c1_1-stud-c3r0: [kE_c1_1, //pub/universe/lego:stud, c3r0]
      kN_c0_0-anti-c0r0: [kN_c0_0, //pub/universe/lego:anti-stud, c0r0]
    desc: "Two courses of the keep's masonry, the second breaking joint against the first"
  castle/keep-lancet:
    type: assy
    map:
      kE_c0_0-anti-c0r0: [kE_c0_0, //pub/universe/lego:anti-stud, c0r0]
      kE_c3_1-stud-c1r0: [kE_c3_1, //pub/universe/lego:stud, c1r0]
    desc: "Four courses of the keep, the lancets in them and the course that closes them"
  castle/keep-top:
    type: assy
    map:
      kE_c0_0-anti-c0r0: [kE_c0_0, //pub/universe/lego:anti-stud, c0r0]
    desc: "What the keep ends with - its last three courses, the merlons, a bartizan at each corner, and the spire"
  castle:
    type: assy
    path: castle.assy
    desc: A gothic castle built from LDraw LEGO parts.
    # Too big to draw exactly: see 'render:' at the end of this file. The prefix
    # is the package's said again, because PartCAD's README generator takes this
    # section in place of the package's rather than merging the two; see
    # TRIANGULATED in tools/gen_f1.py.
    render:
      png:
        reproducible: false
        prefix: ./images
    # Every part is placed by coordinates rather than joined, and a LEGO stud is
    # meant to occupy the part above it - that interference is what makes bricks
    # grip. So the interference check has something true to say about almost
    # every pair here and nowhere to read that it is intended: an overlap which
    # is meant to be there is stated on the joint that causes it, and a
    # coordinate is not a joint.
    #
    # Nothing turns it off. The package is 'manufacturable: false' - nobody is
    # ordering a castle - and that is what makes the check report rather than
    # fail. See the README for what would make it meaningful here.
  # --- f1: generated by tools/gen_f1.py; edit the generator, not this block ---
  f1/tub:
    type: assy
    map:
      pivot-axle-left: [pivot, //pub/universe/lego:technic-axle, left]
      side-frame-left-rail-up-hole-h11-bottom: [side-frame-left, //pub/universe/lego:technic-pin-hole, rail-up-hole-h11-bottom]
      side-frame-left-rail-up-hole-h12-top: [side-frame-left, //pub/universe/lego:technic-pin-hole, rail-up-hole-h12-top]
      side-frame-left-tower-hole-h0-bottom: [side-frame-left, //pub/universe/lego:technic-pin-hole, tower-hole-h0-bottom]
      side-frame-right-rail-up-hole-h3-top: [side-frame-right, //pub/universe/lego:technic-pin-hole, rail-up-hole-h3-top]
    desc: "The tub: both side frames, the battery box between them, the pivot the drivetrain swings on, and the airbox"
  f1/side-frame-left:
    type: assy
    map:
      post-hole-h5-bottom: [post, //pub/universe/lego:technic-pin-hole, h5-bottom]
      rail-lo-hole-h0-bottom: [rail-lo, //pub/universe/lego:technic-pin-hole, h0-bottom]
      rail-lo-hole-h5-top: [rail-lo, //pub/universe/lego:technic-pin-hole, h5-top]
      rail-up-hole-h11-bottom: [rail-up, //pub/universe/lego:technic-pin-hole, h11-bottom]
      rail-up-hole-h12-top: [rail-up, //pub/universe/lego:technic-pin-hole, h12-top]
      tower-hole-h0-bottom: [tower, //pub/universe/lego:technic-pin-hole, h0-bottom]
    desc: "The left side frame: the two rails, the post at the back and the shock tower over it"
  f1/side-frame-right:
    type: assy
    map:
      rail-lo-hole-h5-bottom: [rail-lo, //pub/universe/lego:technic-pin-hole, h5-bottom]
      rail-up-hole-h3-top: [rail-up, //pub/universe/lego:technic-pin-hole, h3-top]
    desc: "The right side frame: the two rails, the post at the back and the shock tower over it"
  f1/battery:
    type: assy
    map:
      pin-l-lo-front-pin-left: [pin-l-lo-front, //pub/universe/lego:technic-pin, left]
      pin-r-lo-front-pin-right: [pin-r-lo-front, //pub/universe/lego:technic-pin, right]
    desc: "The Power Functions battery box, with the pins in its end holes that the side frames go onto"
  f1/airbox:
    type: assy
    map:
      axle-l-axle-left: [axle-l, //pub/universe/lego:technic-axle, left]
    desc: "The Power Functions IR receiver on a crossbeam, and the cross blocks the rear posts carry it by"
  f1/front-end:
    type: assy
    map:
      front-frame-pin-nose-1-l-pin-left: [front-frame, //pub/universe/lego:technic-pin, pin-nose-1-l-pin-left]
    desc: "Everything ahead of the battery: the front frame, both front corners, the steering, the nose and the front wing"
    render:
      png:
        reproducible: false
        prefix: ./images
  f1/front-frame:
    type: assy
    map:
      bulk-l-hole-h0-top: [bulk-l, //pub/universe/lego:technic-pin-hole, h0-top]
      bulk-r-hole-h0-top: [bulk-r, //pub/universe/lego:technic-pin-hole, h0-top]
      nose-ext-l-hole-h6-bottom: [nose-ext-l, //pub/universe/lego:technic-pin-hole, h6-bottom]
      pin-nose-1-l-pin-left: [pin-nose-1-l, //pub/universe/lego:technic-pin, left]
      servo-rail-r-hole-h0-bottom: [servo-rail-r, //pub/universe/lego:technic-pin-hole, h0-bottom]
      shock-beam-hole-h2-top: [shock-beam, //pub/universe/lego:technic-pin-hole, h2-top]
      shock-beam-hole-h8-top: [shock-beam, //pub/universe/lego:technic-pin-hole, h8-top]
    desc: "The front frame: the nose rails, the bulkheads the wishbones pivot on, the shock crossbeam and the servo's cradle"
  f1/front-right:
    type: assy
    map:
      pin-lower-in-pin-left: [pin-lower-in, //pub/universe/lego:technic-pin, left]
    desc: "The right front corner: double wishbones, a kingpin, the knuckle, the wheel and a shock"
  f1/front-left:
    type: assy
    map:
      pin-lower-in-pin-left: [pin-lower-in, //pub/universe/lego:technic-pin, left]
    desc: "The left front corner: double wishbones, a kingpin, the knuckle, the wheel and a shock"
  f1/steering:
    type: assy
    map:
      pin-servo-1-pin-left: [pin-servo-1, //pub/universe/lego:technic-pin, left]
      track-rod-hole-h0-bottom: [track-rod, //pub/universe/lego:technic-pin-hole, h0-bottom]
      track-rod-hole-h14-bottom: [track-rod, //pub/universe/lego:technic-pin-hole, h14-bottom]
    desc: "The servo, its arm and the track rod"
  f1/nose:
    type: assy
    map:
      axle-axle-left: [axle, //pub/universe/lego:technic-axle, left]
      beam-hole-h1-top: [beam, //pub/universe/lego:technic-pin-hole, h1-top]
    desc: "The nose: a cross axle between the nose rails, a crossbeam, and the nose cone"
  f1/front-wing:
    type: assy
    map:
      pin-pylon-l-pin-left: [pin-pylon-l, //pub/universe/lego:technic-pin, left]
    desc: "The front wing: two slats on edge between two endplates, hung from the nose on two pylons"
  f1/drivetrain:
    type: assy
    map:
      inner-l-hole-h10-bottom: [inner-l, //pub/universe/lego:technic-pin-hole, h10-bottom]
    desc: "The rear subframe: the motor unit, the differential, the half axles and wheels, and the two shocks it hangs from"
  f1/motor-unit:
    type: assy
    map:
      pin-motor-l1-pin-left: [pin-motor-l1, //pub/universe/lego:technic-pin, left]
      pin-spacer-1-pin-right: [pin-spacer-1, //pub/universe/lego:technic-pin, right]
    desc: "The XL motor with its pinion, the bracket across its face and the spacer beam beside it"
  f1/rear-wing:
    type: assy
    map:
      axle-axle-left: [axle, //pub/universe/lego:technic-axle, left]
    desc: "The rear wing: an axle through the shock towers, two slats on edge between two endplates, on two pylons"
  f1/sidepod:
    type: assy
    map:
      pin-front-pin-right: [pin-front, //pub/universe/lego:technic-pin, right]
    desc: "A sidepod: one smooth panel pinned to the upper side rail"
  f1/car:
    type: assy
    desc: "The car: every one of its parts joined through its ports, none placed by coordinates"
    render:
      png:
        reproducible: false
        prefix: ./images
  f1:
    type: assy
    path: f1.assy
    desc: A Formula 1 car in LEGO Technic - Power Functions motors, suspension, and the IR remote control.
    render:
      png:
        reproducible: false
        prefix: ./images
  # --- end of f1 ---

  # The pictures the README shows. Each is the model it names, looked at from
  # a camera of its own: an alias renders under its own name with its own
  # 'render:' settings, so 'pc render -r' writes images/<name>.png like any
  # other assembly here, and a README that shows it is never older than the
  # model. The cameras stand 10 m off along the direction they look from: a
  # viewport origin is a point the camera is placed at and aimed from towards
  # the object's centre, and at 100 mm - where '--view' puts it - a model this
  # size is seen from an angle rather than along an axis.
  castle-birdseye:
    type: alias
    source: :castle
    desc: The castle from above its front right corner
    render:
      png:
        viewport_origin: [10000, -10000, 10000]
        viewport_up: [0, 0, 1]
        reproducible: false
  castle-front:
    type: alias
    source: :castle
    desc: The castle from in front, a little to its right and above
    render:
      png:
        viewport_origin: [4000, -10000, 3000]
        viewport_up: [0, 0, 1]
        reproducible: false
  f1-iso:
    type: alias
    source: :f1
    desc: The car and its remote from the front right, above
    render:
      png:
        viewport_origin: [10000, -10000, 10000]
        viewport_up: [0, 0, 1]
        reproducible: false
  f1-front:
    type: alias
    source: :f1
    desc: The car nose-on
    render:
      png:
        viewport_origin: [0, -10000, 0]
        viewport_up: [0, 0, 1]
        reproducible: false
  f1-right:
    type: alias
    source: :f1
    desc: The car from its right side
    render:
      png:
        viewport_origin: [10000, 0, 0]
        viewport_up: [0, 0, 1]
        reproducible: false
  f1-top:
    type: alias
    source: :f1
    desc: The car from above, its nose down the page
    render:
      png:
        viewport_origin: [0, 0, 10000]
        viewport_up: [0, 1, 0]
        reproducible: false

render:
  # README.md is generated, and so is every image in it: 'pc render -r' writes
  # them all, and the CI fails when what it writes differs from what is checked
  # in. The aliases above are left out of its list of assemblies - they are the
  # pictures at the top of it, not models of their own.
  readme:
    exclude: [aliases]
  png:
    # These pictures are checked in, so each has to be the same file every time
    # it is rendered: 'reproducible' takes the projection through OCCT's exact
    # hidden-line algorithm, which works from the surfaces rather than from a
    # triangulation that differs between machines, and rounds every number
    # written into the drawing. See 'reproducible' in '//builtin/render'.
    #
    # Except for the whole castle, the whole car, the views of them and the
    # car's front end, which say 'reproducible: false'. The exact algorithm sets
    # memory aside for every pair of edges in the picture before it draws any of
    # them, a quarter of a byte a pair, so what it needs grows with the square
    # of the model: the car is 423,000 edges and would need 45 GB, the castle
    # 248,000 and 15 GB, the front end 199,000 and 10 GB, and the machine CI
    # renders on has 16 in all, shared by the pictures it draws at once. Those
    # are drawn from a triangulation, which comes out the same again on the
    # same kind of machine - which CI is.
    reproducible: true
    prefix: ./images

# {% raw %} -- 'docs' is prose, and partcad.yaml is a Jinja2 template: the
# README quotes Jinja2 syntax, which must reach YAML as it is written.
docs:
  intro: |
    The parts come from the [LDraw](https://library.ldraw.org) library, as served by
    `//pub/universe/lego/ldraw`. Nothing is vendored here: this package is the
    assemblies, and the geometry is meshed from LDraw's own `.dat` files on demand.

    ## castle

    A gothic castle: spired towers along the curtain wall and at its corners, a
    twin-towered gatehouse over a pointed arch, buttresses with pinnacles between
    the bays, and a tall turreted keep.

    <table><tr>
    <td valign=top><a href="./images/castle-birdseye.png"><img src="./images/castle-birdseye.png" alt="The castle from above" width="420"></a></td>
    <td valign=top><a href="./images/castle-front.png"><img src="./images/castle-front.png" alt="The castle from the front" width="420"></a></td>
    </tr></table>

    731 parts, nine distinct LDraw parts between them:

    | part | count | |
    | --- | --- | --- |
    | `Brick:3005` | 271 | 1 x 1 brick |
    | `Brick:3004` | 153 | 1 x 2 brick |
    | `Brick:3941` | 122 | 2 x 2 round brick |
    | `Brick:3010` | 114 | 1 x 4 brick |
    | `Cone:4589` | 44 | 1 x 1 cone — the spires |
    | `Cone:3942b` | 19 | 2 x 2 cone |
    | `Brick:3009` | 6 | 1 x 6 brick — the keep's floor |
    | `Baseplate:3811` | 1 | 32 x 32 baseplate — what it all stands on |
    | `Cone:3943b` | 1 | 4 x 4 cone — the keep's spire |

    Everything sits on LEGO's own grid: 8 mm stud pitch, 9.6 mm brick height. The
    parts arrive standing upright in PartCAD's Z-up world, so `front`, `top`, `right`
    and `iso` mean what they say.

    ```shell
    pc inspect -a castle
    pc render -a -t png --view iso castle
    ```

    ### The pieces it is built from

    A castle this size repeats itself: four identical corner towers, nine identical
    spires, sixteen identical buttresses. So `castle` is not 731 parts in one file -
    it is ten sub-assemblies under `castle/`, placed 44 times between them, and the
    baseplate. Each one is written once and built once, and every further use of it
    is a cache hit rather than a rebuild; 288 parts are described instead of 731.

    | sub-assembly | parts | used | |
    | --- | --- | --- | --- |
    | `castle/buttress` | 9 | 16 | a pier stepping out from the wall, capped with a pinnacle |
    | `castle/spire` | 4 | 9 | two 2x2 cones flaring off a tower, then two 1x1 cones to a point |
    | `castle/wall` | 65 | 3 | a stretch of curtain wall between two corner towers |
    | `castle/wall-gate` | 71 | 1 | the same wall with the gateway's pointed arch corbelled through it |
    | `castle/tower-corner` | 15 | 4 | the body of a corner tower |
    | `castle/tower-mural` | 12 | 3 | the body of a tower standing along a wall |
    | `castle/tower-gate` | 13 | 2 | the body of one of the gatehouse pair |
    | `castle/keep-courses` | 14 | 3 | two courses of the keep, the second breaking joint against the first |
    | `castle/keep-lancet` | 36 | 2 | four courses: a lancet, and the course that closes it |
    | `castle/keep-top` | 48 | 1 | the keep's last three courses, its merlons, four bartizans and the spire |

    Each is a PartCAD assembly in its own right, so any of them can be looked at,
    rendered or built alone:

    ```shell
    pc inspect -a castle/tower-corner
    pc render -a -t png --view iso castle/wall
    ```

    The keep is cut into pairs of courses rather than left whole because its
    masonry alternates: an even course and the odd one that breaks joint against
    it, three kinds of pair covering all of it but the last course and the roof.
    The walls are not split further - the gate wall differs from a plain one in
    every course, so there is no band of it the two could share.

    ### Joined, not just placed

    A brick placed by coordinates is a brick nothing holds up: the file says where
    it ended up, not what puts it there. Most of these bricks say the other thing
    instead — which brick they sit on, and which stud of it:

    ```yaml
    - part: //pub/universe/lego/ldraw/Brick:3010
      name: w_c1_0
      connect:
        with: //pub/universe/lego:anti-stud
        withInstance: c0r0
        name: w_c0_0
        to: //pub/universe/lego:stud
        toInstance: c2r0
    ```

    `//pub/universe/lego` declares the pair — a `stud` on top of a part and an
    `anti-stud` underneath — and PartCAD works the coordinates out. **Every one of
    the 288 part nodes** is joined that way, in the order they are put together —
    there is not a single `location:` left on a part or a piece anywhere in the
    model.

    Which two ports meet is decided by where they *are*, not by the stud grid the
    part's name implies, because for several of these parts the grid is not the
    answer: a `Cone 2 x 2 x 2` has four anti-studs under it and a single stud on
    top, at its centre, and a `Cone 3 x 3 x 2` has nine and four. A joint picked by
    grid index puts such a part half a stud out.

    A brick joins downwards to a stud under it *or* upwards into an anti-stud over
    it, and that is what keeps the number of coordinates down. A unit's bottom
    course does not have to go first: put one brick of it down, add the brick above
    that bridges it to its neighbour, and the neighbour then snaps up into that
    bridge. So the order is grown rather than given — take whatever can be joined to
    what is already down.

    Each piece's **first brick says nothing at all** — no coordinates and no joint.
    It is the piece's own origin, and where that goes is for whatever places the
    piece to decide, so saying it here would be saying it twice.

    Getting to none of them took four things beyond the joints themselves, and each
    was a fault in the model rather than a limit of the format:

    * **The keep's corners did not bond.** Every course laid its four sides the same
      way, so no brick ever spanned a corner and the keep was four stacks that
      merely touched. The corners alternate now.
    * **A course over an opening has to reach past it.** A lancet capped by two
      bricks meeting over the hole ties nothing; the capping course is laid
      whichever way puts one brick across the opening with a bearing either side,
      which is not the same way for a four-stud stretch as for a six-stud one. The
      gateway's lintel got the same treatment and now bears a stud into the wall on
      each side.
    * **No stretch ends with a single stud.** Three cells laid greedily come out a
      two and a one, and that trailing one sits on the corner with nothing reaching
      across to it.
    * **The keep's spire stood on its own open shaft.** It has a floor now — the
      last course laid solid, six bricks the full width, each crossing the ring
      below at both ends — and a spire built the way the towers' are, since a 3 x 3
      cone cannot be centred on a 6 x 6 keep and was sitting half a stud off the
      grid.

    ### The pieces join each other too, and the whole thing stands on a plate

    A piece is placed by coordinates for the same reason a brick was: nothing says
    what holds it. So each piece externalizes the ports it is joined by, with `map:`:

    ```yaml
    assemblies:
      castle/spire:
        type: assy
        map:
          spire_s0-anti-c0r0: [spire_s0, //pub/universe/lego:anti-stud, c0r0]
    ```

    A name of the piece's choosing, against the node inside it, the interface that
    node implements, and the instance. The interface is not renamed — it is a
    contract — but the instance name is the piece's to pick.

    The walls, towers and buttresses were the hard case: they all stand on the
    ground side by side, and a stud joins what is above to what is below, so edge to
    edge there is nothing to join them by. LEGO's own answer is a baseplate, and the
    library has one big enough — `Baseplate 32 x 32` (3811), 1024 studs against a
    castle covering 30 × 30. Every piece that reaches the ground is joined to it.

    So the baseplate says nothing at all: where it goes decides nothing, since every
    other node is placed relative to it, and where the castle as a whole sits is the
    container's to say.

    ### The one `location:` left, and why it stays

    ```yaml
    name: castle
    location: [[0, 0, 0], [0, 0, 1], 0]   # set the offset to [100.0, -100.0, 0.0] to read coordinates off the stud grid
    ```

    One `location:` in the whole model, on the container, and as it stands it does
    nothing. It used to be a quarter turn about X: LDraw draws its parts Y-up and
    PartCAD's world is Z-up, and no joint can derive that — it is a fact about the
    parts library, not about the model. The parts library has since taken it on
    itself and serves every part standing upright, and the turn left behind laid the
    castle on its side, its baseplate standing up like a wall.

    What is left is the offset, and that is a knob rather than a fact, and not free.
    Left at zero the castle sits at the origin, which is where the default views
    expect to find it. Set to the figure in the comment it stands where the grid
    runs on whole studs from a known corner — worth having while reading the numbers
    by hand, and it costs the rendered views their framing, because they look from a
    fixed point rather than from one relative to the object.

    ### Jinja2, and why every step is still written down

    An ASSY file has to enumerate every step. PartCAD reads the tree it makes to
    work out the bill of materials, and the assembly instructions are that tree
    written out a step to a page, so a step that is not in the file is a step
    nobody is told to take.

    The *text* need not repeat itself, though: every ASSY file is a Jinja2 template,
    rendered before it is parsed. A run of parts laid out regularly can be written
    as the loop it is -

    ```yaml
    {% for i in range(15) %}
    - part: //pub/universe/lego/ldraw/Brick:3941
      name: t_c{{ i }}
      location: [[4.0, {{ (9.6 + i * 9.6) | round(3) }}, 4.0], [0, 1, 0], 0]
    {% endfor %}
    ```

    - and reaches the parser as the fifteen separate nodes it always was. The
    castle used to be written that way, and is not any more: now that every brick is
    joined to the stud it sits on rather than placed, there is no arithmetic left to
    loop over - each joint names its own studs. Between them the eleven files are
    **332 nodes of YAML for a 731-part model**, and every one of those 731 parts is
    still a step of its own.

    ## f1

    A Formula 1 car in LEGO Technic that drives, steers and rides on springs, with
    its Power Functions electrics and the IR remote control beside it.

