# PartCAD package: worked examples built from the LDraw parts library.
#
# The parts come from '//pub/universe/lego/ldraw', which serves the LDraw
# library (https://library.ldraw.org) as parametric PartCAD parts. Nothing is
# vendored here: this package is the assemblies, and the geometry is meshed
# from LDraw's own .dat files on demand.
name: //pub/examples/lego

desc: Assemblies built from the LDraw LEGO parts library.
url: https://library.ldraw.org/
poc: kuzmenkor@gmail.com
partcad: ">=0.8.115"

# Nothing here is a catalogue item somebody can order: these are models built
# out of parts that already exist.
manufacturable: false

dependencies:
  pub:
    # Loaded as '//pub' when this package is the root, and not at all when the
    # index itself imports this package: without it the index would be
    # imported a second time inside itself, as '//pub/examples/lego/pub', and
    # a recursive walk from here ('pc test -r', 'pc render -r') would go
    # through the whole of it instead of through this package. What it loads
    # is the one branch of the index these models use; see its partcad.yaml.
    onlyInRoot: true
    type: local
    path: deps/pub

assemblies:
  castle/spire:
    type: assy
    map:
      spire_s0-anti-c0r0: [spire_s0, //pub/universe/lego:anti-stud, c0r0]
    desc: "A tower's needle roof - two 2x2 cones flaring off the tower, then two 1x1 cones drawing it to a point"
  castle/buttress:
    type: assy
    map:
      butt_c0-anti-c0r0: [butt_c0, //pub/universe/lego:anti-stud, c0r0]
    desc: "A pier stepping out from the wall, capped with a pinnacle"
  castle/tower-corner:
    type: assy
    map:
      t_c0-anti-c0r0: [t_c0, //pub/universe/lego:anti-stud, c0r0]
      t_c14-stud-c0r0: [t_c14, //pub/universe/lego:stud, c0r0]
    desc: "The body of a corner tower, 15 courses of 2x2 round brick"
  castle/tower-mural:
    type: assy
    map:
      t_c0-anti-c0r0: [t_c0, //pub/universe/lego:anti-stud, c0r0]
      t_c11-stud-c0r0: [t_c11, //pub/universe/lego:stud, c0r0]
    desc: "The body of a tower standing along the wall, 12 courses"
  castle/tower-gate:
    type: assy
    map:
      t_c0-anti-c0r0: [t_c0, //pub/universe/lego:anti-stud, c0r0]
      t_c12-stud-c0r0: [t_c12, //pub/universe/lego:stud, c0r0]
    desc: "The body of one of the gatehouse pair, 13 courses"
  castle/wall:
    type: assy
    map:
      w_c0_0-anti-c0r0: [w_c0_0, //pub/universe/lego:anti-stud, c0r0]
    desc: "A stretch of curtain wall between two corner towers, with its lancets and crenellations"
  castle/wall-gate:
    type: assy
    map:
      wL_c0_0-anti-c0r0: [wL_c0_0, //pub/universe/lego:anti-stud, c0r0]
    desc: "The same wall with the gateway's pointed arch corbelled through it"
  castle/keep-courses:
    type: assy
    map:
      kE_c0_0-anti-c0r0: [kE_c0_0, //pub/universe/lego:anti-stud, c0r0]
      kE_c1_1-stud-c1r0: [kE_c1_1, //pub/universe/lego:stud, c1r0]
      kE_c1_1-stud-c3r0: [kE_c1_1, //pub/universe/lego:stud, c3r0]
      kN_c0_0-anti-c0r0: [kN_c0_0, //pub/universe/lego:anti-stud, c0r0]
    desc: "Two courses of the keep's masonry, the second breaking joint against the first"
  castle/keep-lancet:
    type: assy
    map:
      kE_c0_0-anti-c0r0: [kE_c0_0, //pub/universe/lego:anti-stud, c0r0]
      kE_c3_1-stud-c1r0: [kE_c3_1, //pub/universe/lego:stud, c1r0]
    desc: "Four courses of the keep, the lancets in them and the course that closes them"
  castle/keep-top:
    type: assy
    map:
      kE_c0_0-anti-c0r0: [kE_c0_0, //pub/universe/lego:anti-stud, c0r0]
    desc: "What the keep ends with - its last three courses, the merlons, a bartizan at each corner, and the spire"
  castle:
    type: assy
    path: castle.assy
    desc: A gothic castle built from LDraw LEGO parts.
    # Every part is placed by coordinates rather than joined, and a LEGO stud is
    # meant to occupy the part above it - that interference is what makes bricks
    # grip. So the interference check has something true to say about almost
    # every pair here and nowhere to read that it is intended: an overlap which
    # is meant to be there is stated on the joint that causes it, and a
    # coordinate is not a joint.
    #
    # Nothing turns it off. The package is 'manufacturable: false' - nobody is
    # ordering a castle - and that is what makes the check report rather than
    # fail. See the README for what would make it meaningful here.
  # --- f1: generated by tools/gen_f1.py; edit the generator, not this block ---
  f1/tub:
    type: assy
    map:
      pivot-axle-left: [pivot, //pub/universe/lego:technic-axle, left]
      side-frame-left-rail-up-hole-h11-bottom: [side-frame-left, //pub/universe/lego:technic-pin-hole, rail-up-hole-h11-bottom]
      side-frame-left-rail-up-hole-h12-top: [side-frame-left, //pub/universe/lego:technic-pin-hole, rail-up-hole-h12-top]
      side-frame-left-tower-hole-h0-bottom: [side-frame-left, //pub/universe/lego:technic-pin-hole, tower-hole-h0-bottom]
      side-frame-right-rail-up-hole-h3-top: [side-frame-right, //pub/universe/lego:technic-pin-hole, rail-up-hole-h3-top]
    desc: "The tub: both side frames, the battery box between them, the pivot the drivetrain swings on, and the airbox"
  f1/side-frame-left:
    type: assy
    map:
      post-hole-h5-bottom: [post, //pub/universe/lego:technic-pin-hole, h5-bottom]
      rail-lo-hole-h0-bottom: [rail-lo, //pub/universe/lego:technic-pin-hole, h0-bottom]
      rail-lo-hole-h5-top: [rail-lo, //pub/universe/lego:technic-pin-hole, h5-top]
      rail-up-hole-h11-bottom: [rail-up, //pub/universe/lego:technic-pin-hole, h11-bottom]
      rail-up-hole-h12-top: [rail-up, //pub/universe/lego:technic-pin-hole, h12-top]
      tower-hole-h0-bottom: [tower, //pub/universe/lego:technic-pin-hole, h0-bottom]
    desc: "The left side frame: the two rails, the post at the back and the shock tower over it"
  f1/side-frame-right:
    type: assy
    map:
      rail-lo-hole-h5-bottom: [rail-lo, //pub/universe/lego:technic-pin-hole, h5-bottom]
      rail-up-hole-h3-top: [rail-up, //pub/universe/lego:technic-pin-hole, h3-top]
    desc: "The right side frame: the two rails, the post at the back and the shock tower over it"
  f1/battery:
    type: assy
    map:
      pin-l-lo-front-pin-left: [pin-l-lo-front, //pub/universe/lego:technic-pin, left]
      pin-r-lo-front-pin-right: [pin-r-lo-front, //pub/universe/lego:technic-pin, right]
    desc: "The Power Functions battery box, with the pins in its end holes that the side frames go onto"
  f1/airbox:
    type: assy
    map:
      axle-l-axle-left: [axle-l, //pub/universe/lego:technic-axle, left]
    desc: "The Power Functions IR receiver on a crossbeam, and the cross blocks the rear posts carry it by"
  f1/front-end:
    type: assy
    map:
      front-frame-pin-nose-1-l-pin-left: [front-frame, //pub/universe/lego:technic-pin, pin-nose-1-l-pin-left]
    desc: "Everything ahead of the battery: the front frame, both front corners, the steering, the nose and the front wing"
  f1/front-frame:
    type: assy
    map:
      bulk-l-hole-h0-top: [bulk-l, //pub/universe/lego:technic-pin-hole, h0-top]
      bulk-r-hole-h0-top: [bulk-r, //pub/universe/lego:technic-pin-hole, h0-top]
      nose-ext-l-hole-h6-bottom: [nose-ext-l, //pub/universe/lego:technic-pin-hole, h6-bottom]
      pin-nose-1-l-pin-left: [pin-nose-1-l, //pub/universe/lego:technic-pin, left]
      servo-rail-r-hole-h0-bottom: [servo-rail-r, //pub/universe/lego:technic-pin-hole, h0-bottom]
      shock-beam-hole-h2-top: [shock-beam, //pub/universe/lego:technic-pin-hole, h2-top]
      shock-beam-hole-h8-top: [shock-beam, //pub/universe/lego:technic-pin-hole, h8-top]
    desc: "The front frame: the nose rails, the bulkheads the wishbones pivot on, the shock crossbeam and the servo's cradle"
  f1/front-right:
    type: assy
    map:
      pin-lower-in-pin-left: [pin-lower-in, //pub/universe/lego:technic-pin, left]
    desc: "The right front corner: double wishbones, a kingpin, the knuckle, the wheel and a shock"
  f1/front-left:
    type: assy
    map:
      pin-lower-in-pin-left: [pin-lower-in, //pub/universe/lego:technic-pin, left]
    desc: "The left front corner: double wishbones, a kingpin, the knuckle, the wheel and a shock"
  f1/steering:
    type: assy
    map:
      pin-servo-1-pin-left: [pin-servo-1, //pub/universe/lego:technic-pin, left]
      track-rod-hole-h0-bottom: [track-rod, //pub/universe/lego:technic-pin-hole, h0-bottom]
      track-rod-hole-h14-bottom: [track-rod, //pub/universe/lego:technic-pin-hole, h14-bottom]
    desc: "The servo, its arm and the track rod"
  f1/nose:
    type: assy
    map:
      axle-axle-left: [axle, //pub/universe/lego:technic-axle, left]
      beam-hole-h1-top: [beam, //pub/universe/lego:technic-pin-hole, h1-top]
    desc: "The nose: a cross axle between the nose rails, a crossbeam, and the nose cone"
  f1/front-wing:
    type: assy
    map:
      pin-pylon-l-pin-left: [pin-pylon-l, //pub/universe/lego:technic-pin, left]
    desc: "The front wing: two slats on edge between two endplates, hung from the nose on two pylons"
  f1/drivetrain:
    type: assy
    map:
      inner-l-hole-h10-bottom: [inner-l, //pub/universe/lego:technic-pin-hole, h10-bottom]
    desc: "The rear subframe: the motor unit, the differential, the half axles and wheels, and the two shocks it hangs from"
  f1/motor-unit:
    type: assy
    map:
      pin-motor-l1-pin-left: [pin-motor-l1, //pub/universe/lego:technic-pin, left]
      pin-spacer-1-pin-right: [pin-spacer-1, //pub/universe/lego:technic-pin, right]
    desc: "The XL motor with its pinion, the bracket across its face and the spacer beam beside it"
  f1/rear-wing:
    type: assy
    map:
      axle-axle-left: [axle, //pub/universe/lego:technic-axle, left]
    desc: "The rear wing: an axle through the shock towers, two slats on edge between two endplates, on two pylons"
  f1/sidepod:
    type: assy
    map:
      pin-front-pin-right: [pin-front, //pub/universe/lego:technic-pin, right]
    desc: "A sidepod: one smooth panel pinned to the upper side rail"
  f1/car:
    type: assy
    desc: "The car: every one of its parts joined through its ports, none placed by coordinates"
  f1:
    type: assy
    path: f1.assy
    desc: A Formula 1 car in LEGO Technic - Power Functions motors, suspension, and the IR remote control.
  # --- end of f1 ---
